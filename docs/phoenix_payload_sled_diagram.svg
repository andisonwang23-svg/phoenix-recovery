<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="loadArrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 13px Arial, sans-serif; fill: #475569; }
      .callout { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .leader { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .structure { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .metal { fill: #e2e8f0; stroke: #475569; stroke-width: 3; }
      .electronics { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .battery { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .servo { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
      .line { fill: none; stroke: #0f766e; stroke-width: 4; }
      .load { fill: none; stroke: #dc2626; stroke-width: 5; marker-end: url(#loadArrow); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#f8fafc"/>
  <text x="700" y="54" text-anchor="middle" class="title">Phoenix Recovery Payload Module — Cutaway</text>
  <text x="700" y="84" text-anchor="middle" class="subtitle">Conceptual mounting layout; final dimensions and hardware require physical measurement and mentor review</text>

  <!-- Rocket body cutaway -->
  <path d="M430 130 Q700 20 970 130 L970 865 Q700 925 430 865 Z" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
  <path d="M430 130 Q700 20 970 130 L970 235 L430 235 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="700" y="150" text-anchor="middle" class="label">Nose / parafoil compartment</text>

  <!-- Parafoil pack -->
  <path d="M530 172 Q700 112 870 172 L835 210 Q700 170 565 210 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="700" y="196" text-anchor="middle" class="small">Packed parafoil</text>

  <!-- Bulkheads -->
  <rect x="445" y="245" width="510" height="32" rx="8" class="structure"/>
  <text x="700" y="267" text-anchor="middle" class="label">Forward structural bulkhead</text>
  <rect x="445" y="815" width="510" height="32" rx="8" class="structure"/>
  <text x="700" y="838" text-anchor="middle" class="label">Aft structural bulkhead</text>

  <!-- Recovery attachment and load path -->
  <circle cx="700" cy="260" r="16" fill="#fca5a5" stroke="#991b1b" stroke-width="4"/>
  <path d="M700 260 C690 220 720 205 700 170" class="load"/>
  <text x="735" y="228" class="tiny" fill="#991b1b">Rated recovery attachment</text>

  <!-- Threaded rods -->
  <rect x="500" y="277" width="18" height="538" class="metal"/>
  <rect x="882" y="277" width="18" height="538" class="metal"/>
  <g fill="#475569">
    <circle cx="509" cy="300" r="13"/><circle cx="891" cy="300" r="13"/>
    <circle cx="509" cy="792" r="13"/><circle cx="891" cy="792" r="13"/>
  </g>

  <!-- Sled -->
  <rect x="540" y="305" width="320" height="485" rx="18" class="structure"/>
  <text x="700" y="333" text-anchor="middle" class="label">Removable avionics sled</text>

  <!-- GPS -->
  <rect x="585" y="360" width="230" height="62" rx="10" class="electronics"/>
  <text x="700" y="388" text-anchor="middle" class="label">GNSS / GPS module</text>
  <text x="700" y="410" text-anchor="middle" class="tiny">Keep antenna facing outward; avoid metal above it</text>

  <!-- Controller -->
  <rect x="575" y="450" width="250" height="105" rx="12" class="electronics"/>
  <text x="700" y="485" text-anchor="middle" class="label">Heltec ESP32-S3</text>
  <text x="700" y="510" text-anchor="middle" class="small">IMU + barometer on standoffs</text>
  <circle cx="610" cy="530" r="7" fill="#64748b"/><circle cx="790" cy="530" r="7" fill="#64748b"/>

  <!-- Battery -->
  <rect x="585" y="590" width="230" height="92" rx="16" class="battery"/>
  <text x="700" y="625" text-anchor="middle" class="label">Battery in fitted cradle</text>
  <path d="M575 615 L825 655" stroke="#b45309" stroke-width="12" opacity="0.65"/>
  <path d="M575 655 L825 615" stroke="#b45309" stroke-width="12" opacity="0.65"/>
  <text x="700" y="672" text-anchor="middle" class="tiny">Strap + secondary mechanical retainer + end stops</text>

  <!-- Servos -->
  <rect x="555" y="710" width="125" height="62" rx="8" class="servo"/>
  <rect x="720" y="710" width="125" height="62" rx="8" class="servo"/>
  <text x="617" y="747" text-anchor="middle" class="label">Left servo</text>
  <text x="782" y="747" text-anchor="middle" class="label">Right servo</text>

  <!-- Brake lines -->
  <path d="M617 710 C590 635 520 510 575 273 C600 220 610 205 620 190" class="line"/>
  <path d="M782 710 C810 635 880 510 825 273 C800 220 790 205 780 190" class="line"/>

  <!-- Left callouts -->
  <rect x="40" y="175" width="315" height="108" class="callout"/>
  <text x="58" y="205" class="label">Recovery loads</text>
  <text x="58" y="233" class="small">Attach harness to structural bulkhead.</text>
  <text x="58" y="257" class="small">Never load the PCB, sled or battery strap.</text>
  <path d="M355 230 C400 230 430 240 680 260" class="leader"/>

  <rect x="40" y="370" width="315" height="108" class="callout"/>
  <text x="58" y="400" class="label">Threaded-rod retention</text>
  <text x="58" y="428" class="small">Two rods, washers and locking nuts</text>
  <text x="58" y="452" class="small">capture the sled between bulkheads.</text>
  <path d="M355 425 C410 425 440 420 500 420" class="leader"/>

  <rect x="40" y="585" width="315" height="125" class="callout"/>
  <text x="58" y="615" class="label">Battery restraint</text>
  <text x="58" y="643" class="small">Use a cradle, strap and hard end stops.</text>
  <text x="58" y="667" class="small">Foam may isolate vibration but must not</text>
  <text x="58" y="691" class="small">be the primary restraint.</text>
  <path d="M355 645 C435 645 490 637 585 637" class="leader"/>

  <!-- Right callouts -->
  <rect x="1045" y="175" width="315" height="115" class="callout"/>
  <text x="1063" y="205" class="label">Clean deployment path</text>
  <text x="1063" y="233" class="small">Keep steering lines away from wiring,</text>
  <text x="1063" y="257" class="small">sharp edges, rods and the separating joint.</text>
  <path d="M1045 240 C995 240 925 250 825 275" class="leader"/>

  <rect x="1045" y="390" width="315" height="116" class="callout"/>
  <text x="1063" y="420" class="label">Electronics mounting</text>
  <text x="1063" y="448" class="small">Boards mount on standoffs with screws.</text>
  <text x="1063" y="472" class="small">Add connector strain relief and service loops.</text>
  <path d="M1045 452 C980 452 900 490 825 500" class="leader"/>

  <rect x="1045" y="625" width="315" height="125" class="callout"/>
  <text x="1063" y="655" class="label">Servo structure</text>
  <text x="1063" y="683" class="small">Screw servos into rigid brackets.</text>
  <text x="1063" y="707" class="small">Brake loads transfer into the sled and</text>
  <text x="1063" y="731" class="small">bulkheads—not into wires or circuit boards.</text>
  <path d="M1045 692 C965 692 900 725 845 735" class="leader"/>

  <!-- Bottom notes -->
  <rect x="125" y="900" width="1150" height="54" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="700" y="923" text-anchor="middle" class="small">INERT TEST ARTICLE FIRST • Confirm mass and center of gravity • Shake-test and pull-test • Keep flare disabled</text>
  <text x="700" y="945" text-anchor="middle" class="tiny">Concept only: use measured dimensions, rated hardware and an experienced rocketry mentor for final structural design.</text>
</svg>
