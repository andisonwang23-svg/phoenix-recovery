; ============================================================================
; PHOENIX RECOVERY — PlatformIO project configuration (root)
;
; The repo holds two independent firmwares:
;   rocket   — flight controller on the rocket Heltec V4
;   ground   — receiver Heltec V4, lives in ground_station/firmware
;              (self-contained platformio.ini in that folder)
;   native   — host-compiled unit tests for all hardware-free logic
;
; Root source dir is firmware/src (set globally — per-env src_dir is not
; supported in PlatformIO >= 6.0, so the ground firmware is its own project).
; ============================================================================

[platformio]
default_envs = rocket
test_dir = tests
src_dir = firmware/src

[env]
framework = arduino

[env:rocket]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.variant = heltec_wifi_lora_32_V4
board_build.variants_dir = variants
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_build.psram = enabled
board_build.filesystem = littlefs
board_upload.port = /dev/cu.usbmodem11201
; Conservative speed prevents intermittent USB/JTAG disconnects during flash.
upload_speed = 115200
monitor_speed = 115200
build_flags =
	-Wall -Wextra -Werror=return-type
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBENCH_TEST_MODE=0
	-DSIMULATION_MODE=0
	-DFLASH_EVENT_LOG_ENABLED=0
build_src_filter =
	+<*>
	-<diagnostics/>
lib_deps =
	jgromes/RadioLib@^7.0.0
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	mikalhart/TinyGPSPlus@^1.0.2
	madhephaestus/ESP32Servo@^3.0.5
	adafruit/Adafruit BMP3XX Library@^2.1.6
	me-no-dev/ESPAsyncWebServer@^1.2.3
	me-no-dev/AsyncTCP@^1.1.1

; Minimal starter firmware for new-board bring-up.
; It does not run the recovery controller, servos, Wi-Fi, LoRa, GPS, or barometer.
; It only scans the PHOENIX I2C bus and prints BNO085 tilt readings if found.
[env:imu_i2c_scan]
extends = env:rocket
build_src_filter =
	-<*>
	+<diagnostics/imu_i2c_scan.cpp>
lib_deps =
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	adafruit/Adafruit BMP3XX Library@^2.1.6

; Host-native unit tests (pure logic only, no Arduino headers)
[env:native]
platform = native
framework =
test_build_src = false
build_flags = -Wall -Wextra -std=c++17 -Ifirmware/src -Itests -DSIMULATION_MODE=1
lib_deps =
